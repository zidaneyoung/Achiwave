x-backend-environment: &backend-environment
  ACHIWAVE_APP_ENVIRONMENT: development
  ACHIWAVE_HOST: 0.0.0.0
  ACHIWAVE_PORT: 8000
  ACHIWAVE_LOG_LEVEL: ${ACHIWAVE_LOG_LEVEL:-INFO}
  ACHIWAVE_DATABASE_URL: postgresql+psycopg://${ACHIWAVE_POSTGRES_USER:-achiwave}:${ACHIWAVE_POSTGRES_PASSWORD:-replace-with-local-password}@postgres:5432/${ACHIWAVE_POSTGRES_DB:-achiwave}
  ACHIWAVE_REDIS_URL: redis://redis:6379/0
  ACHIWAVE_CELERY_BROKER_URL: redis://redis:6379/0
  ACHIWAVE_CELERY_RESULT_BACKEND: redis://redis:6379/0

x-backend-service: &backend-service
  image: achiwave-backend-local
  build:
    context: ../apps/backend
    dockerfile: Dockerfile
  environment: *backend-environment
  init: true
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_USER: ${ACHIWAVE_POSTGRES_USER:-achiwave}
      POSTGRES_PASSWORD: ${ACHIWAVE_POSTGRES_PASSWORD:-replace-with-local-password}
      POSTGRES_DB: ${ACHIWAVE_POSTGRES_DB:-achiwave}
    ports:
      - "127.0.0.1:${ACHIWAVE_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8.2.8-alpine3.22
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
    ports:
      - "127.0.0.1:${ACHIWAVE_REDIS_PORT:-6379}:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s

  backend:
    <<: *backend-service
    command:
      - python
      - -m
      - uvicorn
      - achiwave_backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:${ACHIWAVE_BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 3s
      timeout: 4s
      retries: 20
      start_period: 5s

  worker:
    <<: *backend-service
    command:
      - python
      - -m
      - celery
      - -A
      - achiwave_backend.worker:celery_app
      - worker
      - --loglevel=INFO

  scheduler:
    <<: *backend-service
    command:
      - python
      - -m
      - celery
      - -A
      - achiwave_backend.worker:celery_app
      - beat
      - --loglevel=INFO
      - --schedule
      - .runtime/celerybeat-schedule

volumes:
  postgres_data:
